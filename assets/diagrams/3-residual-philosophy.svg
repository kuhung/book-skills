<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">残差设计哲学</title>
  <desc id="desc">社区热门划线是共识基线，个人划线与想法是残差补充，两者相加才是你对这本书的完整理解。</desc>
  <rect x="1" y="1" width="778" height="438" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#1f2933">残差思维 · 为什么要保留你的个人划线</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">AI 对一本书的压缩是有损的——损掉的，恰恰是读者独有的个人视角</text>

  <!-- formula -->
  <text x="40" y="118" font-size="15" font-weight="700" fill="#0d9488">社区共识（基线）</text>
  <text x="235" y="118" font-size="15" font-weight="700" fill="#6b7280">＋</text>
  <text x="258" y="118" font-size="15" font-weight="700" fill="#d97706">你的补充（残差）</text>
  <text x="445" y="118" font-size="15" font-weight="700" fill="#6b7280">＝</text>
  <text x="468" y="118" font-size="15" font-weight="700" fill="#1f2933">你对这本书的完整理解</text>

  <!-- stacked bars -->
  <!-- baseline -->
  <rect x="40" y="150" width="360" height="150" rx="14" fill="#ccfbf1" stroke="#5eead4"/>
  <rect x="40" y="150" width="6" height="150" rx="3" fill="#0d9488"/>
  <text x="64" y="182" font-size="16" font-weight="700" fill="#0f766e">社区热门划线</text>
  <text x="64" y="210" font-size="13" fill="#134e4a">大家都划的那几句——书里的公认要点</text>
  <text x="64" y="234" font-size="13" fill="#134e4a">带划线人数排名，代表共识基线</text>
  <text x="64" y="266" font-size="12.5" fill="#0d9488">作用：补齐你可能忽略的重要内容，防止个人视角的盲区</text>

  <!-- residual -->
  <rect x="40" y="316" width="360" height="88" rx="14" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="40" y="316" width="6" height="88" rx="3" fill="#d97706"/>
  <text x="64" y="346" font-size="16" font-weight="700" fill="#b45309">你的个人划线 + 想法</text>
  <text x="64" y="372" font-size="13" fill="#92400e">共识之外，「你」额外标记与写下的——</text>
  <text x="64" y="392" font-size="13" fill="#92400e">这才是这本书对你的独特价值，即「残差」</text>

  <!-- right note panel -->
  <rect x="430" y="150" width="310" height="254" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="454" y="182" font-size="15" font-weight="700" fill="#1f2933">两条铁律</text>

  <circle cx="462" cy="212" r="4" fill="#0d9488"/>
  <text x="476" y="217" font-size="13" font-weight="700" fill="#1f2933">只作补充，不做评判</text>
  <text x="476" y="238" font-size="12.5" fill="#6b7280">直接呈现个人补充即可，不做</text>
  <text x="476" y="256" font-size="12.5" fill="#6b7280">「我认同 / 不认同某条共识」</text>
  <text x="476" y="274" font-size="12.5" fill="#6b7280">这类对抗性评判</text>

  <circle cx="462" cy="304" r="4" fill="#d97706"/>
  <text x="476" y="309" font-size="13" font-weight="700" fill="#1f2933">第二次残差 · 实战修正</text>
  <text x="476" y="330" font-size="12.5" fill="#6b7280">技能在实战中暴露的偏差，回写</text>
  <text x="476" y="348" font-size="12.5" fill="#6b7280">到 SKILL.md 的 Field Notes 章节，</text>
  <text x="476" y="366" font-size="12.5" fill="#6b7280">让技能随使用不断进化</text>
</svg>
