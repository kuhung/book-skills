<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">五步转化流水线</title>
  <desc id="desc">微信读书数据经私有存档、结构化重组、提取技能、README 映射、多 Agent 分发五步，private 目录被 gitignore 隔离。</desc>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="498" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#1f2933">五步流水线 · 从划线到可执行技能</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">严格顺序 Step 1 → 5，每步产物落到固定目录，禁止跳步</text>

  <!-- data source band -->
  <rect x="40" y="96" width="800" height="56" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="120" font-size="13" font-weight="700" fill="#4f46e5">数据源 · 微信读书 API（weread-skills）</text>
  <text x="60" y="140" font-size="12.5" fill="#6b7280">个人划线 + 个人想法（你的视角）　·　社区热门划线（大家的共识）　·　书籍信息 / 章节目录</text>
  <line x1="440" y1="152" x2="440" y2="182" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- five steps -->
  <!-- step boxes: x = 40,204,368,532,696 ; w=140 ; y=190 h=170 -->
  <!-- arrows between -->
  <line x1="182" y1="275" x2="200" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="346" y1="275" x2="364" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="510" y1="275" x2="528" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="674" y1="275" x2="692" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 1 -->
  <g>
    <rect x="40" y="190" width="142" height="170" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="216" r="14" fill="#9ca3af"/>
    <text x="66" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="90" y="221" font-size="15" font-weight="700" fill="#1f2933">私有存档</text>
    <text x="58" y="252" font-size="12" fill="#6b7280">全部原始数据</text>
    <text x="58" y="270" font-size="12" fill="#6b7280">存为不可篡改</text>
    <text x="58" y="288" font-size="12" fill="#6b7280">的原始备份</text>
    <rect x="56" y="308" width="112" height="36" rx="8" fill="#f3f4f6"/>
    <text x="112" y="324" text-anchor="middle" font-size="10.5" fill="#6b7280">private/</text>
    <text x="112" y="338" text-anchor="middle" font-size="10.5" fill="#6b7280">…_private.md</text>
  </g>
  <!-- Step 2 -->
  <g>
    <rect x="204" y="190" width="142" height="170" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="230" cy="216" r="14" fill="#4f46e5"/>
    <text x="230" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="254" y="221" font-size="15" font-weight="700" fill="#1f2933">结构化重组</text>
    <text x="222" y="252" font-size="12" fill="#6b7280">个人 + 社区双源</text>
    <text x="222" y="270" font-size="12" fill="#6b7280">重构为逻辑主题</text>
    <text x="222" y="288" font-size="12" fill="#6b7280">含思维导图</text>
    <rect x="220" y="308" width="112" height="36" rx="8" fill="#eef2ff"/>
    <text x="276" y="324" text-anchor="middle" font-size="10.5" fill="#4f46e5">notes/</text>
    <text x="276" y="338" text-anchor="middle" font-size="10.5" fill="#4f46e5">…_笔记.md</text>
  </g>
  <!-- Step 3 -->
  <g>
    <rect x="368" y="190" width="142" height="170" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="394" cy="216" r="14" fill="#0d9488"/>
    <text x="394" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="418" y="221" font-size="15" font-weight="700" fill="#1f2933">提取技能</text>
    <text x="386" y="252" font-size="12" fill="#6b7280">识别可落地的</text>
    <text x="386" y="270" font-size="12" fill="#6b7280">方法论框架</text>
    <text x="386" y="288" font-size="12" fill="#6b7280">正文 100 行内</text>
    <rect x="384" y="308" width="112" height="36" rx="8" fill="#ccfbf1"/>
    <text x="440" y="324" text-anchor="middle" font-size="10.5" fill="#0d9488">skills/…/</text>
    <text x="440" y="338" text-anchor="middle" font-size="10.5" fill="#0d9488">SKILL.md</text>
  </g>
  <!-- Step 4 -->
  <g>
    <rect x="532" y="190" width="142" height="170" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="558" cy="216" r="14" fill="#7c3aed"/>
    <text x="558" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="582" y="221" font-size="15" font-weight="700" fill="#1f2933">README</text>
    <text x="550" y="252" font-size="12" fill="#6b7280">更新技能注册表</text>
    <text x="550" y="270" font-size="12" fill="#6b7280">建立书名 →</text>
    <text x="550" y="288" font-size="12" fill="#6b7280">场景映射</text>
    <rect x="548" y="308" width="112" height="36" rx="8" fill="#f3e8ff"/>
    <text x="604" y="330" text-anchor="middle" font-size="10.5" fill="#7c3aed">README.md</text>
  </g>
  <!-- Step 5 -->
  <g>
    <rect x="696" y="190" width="142" height="170" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="722" cy="216" r="14" fill="#d97706"/>
    <text x="722" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
    <text x="746" y="221" font-size="15" font-weight="700" fill="#1f2933">分发</text>
    <text x="714" y="252" font-size="12" fill="#6b7280">软链接到四家</text>
    <text x="714" y="270" font-size="12" fill="#6b7280">Agent 挂载点</text>
    <text x="714" y="288" font-size="12" fill="#6b7280">自校验通过</text>
    <rect x="712" y="308" width="112" height="36" rx="8" fill="#fef3c7"/>
    <text x="768" y="330" text-anchor="middle" font-size="10.5" fill="#d97706">./install.sh</text>
  </g>

  <!-- boundary annotation -->
  <rect x="40" y="392" width="142" height="72" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="111" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">🔒 gitignore 隔离</text>
  <text x="111" y="438" text-anchor="middle" font-size="11.5" fill="#9a3412">原始划线绝不</text>
  <text x="111" y="454" text-anchor="middle" font-size="11.5" fill="#9a3412">进入公开仓库</text>

  <rect x="204" y="392" width="306" height="72" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="357" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">公开产物 · 唯一事实源</text>
  <text x="357" y="438" text-anchor="middle" font-size="11.5" fill="#134e4a">notes/ 是脱敏后的结构化重组；skills/ 是可执行技能</text>
  <text x="357" y="454" text-anchor="middle" font-size="11.5" fill="#134e4a">残差思维：社区共识（基线）+ 你的补充 = 完整理解</text>

  <rect x="532" y="392" width="306" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="685" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">分发即挂载</text>
  <text x="685" y="438" text-anchor="middle" font-size="11.5" fill="#1e40af">install.sh 幂等重跑，软链接到各 Agent 标准目录</text>
  <text x="685" y="454" text-anchor="middle" font-size="11.5" fill="#1e40af">并重新生成 AGENTS.md 索引</text>
</svg>
